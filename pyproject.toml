[project]
name = "eos"
version = "0.1.0"
description = "Equation of State codes for dense matter in neutron stars"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eos*"]

# Ship the precomputed observational M-R contours inside the package, so
# eos.general.observational_constraints.add_observational_constraints() works
# from an installed wheel with no path argument. Listed explicitly rather than
# relying on include-package-data inference.
[tool.setuptools.package-data]
"eos.general" = ["data/contours/*.csv"]

[tool.pytest.ini_options]
markers = ["slow: long-running (excluded with -m 'not slow')"]
